<main class="shell">
  <header class="hero">
    <p class="eyebrow">Everything Claude Code</p>
    <h1>{{ title }}</h1>

      This starter lives under <code>apps/</code> so the root ECC rules, agents, and skills apply automatically.

  <section class="card">

  </section>
</main>
